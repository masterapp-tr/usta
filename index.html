<style>
/* Düzen: yumuşak kartlı servis uygulaması. Üstte petrol mavisi karşılama alanı, altta yüzen menü. */
:root{--bg:#EEF3F6;--panel:#FFFFFF;--panel2:#E7EEF2;--ink:#12303D;--mute:#5E7480;--line:#DCE5EA;--head1:#12566A;--head2:#082C38;--head-ink:#FFFFFF;--accent:#F9BE3F;--accent2:#F39A1E;--accent-ink:#3B2500;--link:#0F6A85;--plate:#FFFFFF;--plate-ink:#0C0F12;--plate-blue:#0A3CA6;--plate-line:#C7D1D8;--c-sira:#56689A;--c-servis:#1368D6;--c-parca:#B85F00;--c-hazir:#0E8A45;--c-teslim:#66767F;--on-c:#FFFFFF;--danger:#C5352B;--wa:#12A150;--wa-ink:#FFFFFF;--m-c:#D19A00;--m-g:#E0640F;--m-k:#D32F2F;--car1:#FFFFFF;--car2:#D5E2E9;--glass:#BFD8E4;--shadow:0 8px 24px rgba(16,62,78,.09);--shadow2:0 14px 34px rgba(16,62,78,.2);--display:Outfit,system-ui,Roboto,"Segoe UI",Arial,sans-serif;--body:Manrope,system-ui,Roboto,"Segoe UI",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A21;--panel:#13262F;--panel2:#1E3743;--ink:#E9F2F6;--mute:#97ADB9;--line:#264350;--head1:#135468;--head2:#0A2A35;--link:#7CCBE3;--plate-line:#000000;--c-sira:#A6B5E2;--c-servis:#79B4FF;--c-parca:#F5B066;--c-hazir:#5FD99A;--c-teslim:#93A5AF;--on-c:#0B1A21;--danger:#FF8F85;--wa:#22B566;--wa-ink:#04140B;--car1:#2C4A58;--car2:#1E3743;--glass:#0F2028;--shadow:0 8px 24px rgba(0,0,0,.32);--shadow2:0 14px 34px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1A21;--panel:#13262F;--panel2:#1E3743;--ink:#E9F2F6;--mute:#97ADB9;--line:#264350;--head1:#135468;--head2:#0A2A35;--link:#7CCBE3;--plate-line:#000000;--c-sira:#A6B5E2;--c-servis:#79B4FF;--c-parca:#F5B066;--c-hazir:#5FD99A;--c-teslim:#93A5AF;--on-c:#0B1A21;--danger:#FF8F85;--wa:#22B566;--wa-ink:#04140B;--car1:#2C4A58;--car2:#1E3743;--glass:#0F2028;--shadow:0 8px 24px rgba(0,0,0,.32);--shadow2:0 14px 34px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head2)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.top{background:linear-gradient(150deg,var(--head1),var(--head2) 78%);color:var(--head-ink);border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.stripe{height:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.top-in{position:relative;display:grid;gap:16px;padding-block:20px 20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-width:1400px;margin-inline:auto}
.hero-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero-row img{width:46px;height:46px;object-fit:cover;border-radius:14px;background:#fff}
.brand{min-width:0;flex:1}
.brand h1{font:700 25px/1.12 var(--display);overflow-wrap:anywhere;text-wrap:balance}
.brand p{font-size:13.5px;opacity:.78}
.hero-car{position:absolute;right:-22px;top:6px;width:215px;opacity:.13;pointer-events:none;color:#fff}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;z-index:1}
.metric{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px;min-width:0}
.metric span{display:block;font-size:12.5px;opacity:.82}
.metric b{display:block;font:700 26px/1.15 var(--display);overflow-wrap:anywhere}
.metric.gold{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.metric.gold span{opacity:.85}
main{padding-block:16px 190px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin-inline:auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.h2{font:700 19px/1.2 var(--display);text-wrap:balance;display:flex;align-items:center;gap:9px}
.ic{width:32px;height:32px;border-radius:10px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--link) 13%,transparent);color:var(--link);flex:none}
.ic svg{width:18px;height:18px}
.lbl{font-size:13px;font-weight:600;color:var(--mute)}
.mute{color:var(--mute);font-size:14px}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--accent) 24%,var(--panel));color:var(--ink);padding:12px 14px;border-radius:18px}
.notice p{flex:1 1 220px;min-width:0;font-weight:600;font-size:14.5px}
.notice button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);padding:9px 16px;border-radius:999px;font-weight:700}
.searchw{position:relative;display:block}
.searchw svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mute);pointer-events:none}
.search{width:100%;padding:13px 16px 13px 44px;background:var(--panel);border:0;border-radius:16px;box-shadow:var(--shadow)}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:999px;background:var(--panel);color:var(--mute);font-weight:700;font-size:14px;display:flex;gap:7px;align-items:center}
.fchip i{font-style:normal;font-size:12.5px;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:10px;background:var(--panel2);color:var(--ink)}
.fchip.on{background:var(--head1);color:#fff}
.fchip.on i{background:rgba(255,255,255,.2);color:#fff}
.board{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.col-h{display:flex;align-items:center;gap:8px}
.col-h::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.col-h h2{font:700 17px/1.1 var(--display);color:var(--ink)}
.col-h span{font:600 14px/1 var(--display);color:var(--mute)}
.empty{padding:16px;color:var(--mute);font-size:14px;background:color-mix(in srgb,var(--panel) 55%,transparent);border-radius:16px;text-align:center}
.card{background:var(--panel);border-radius:20px;padding:14px;display:grid;gap:10px;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font:600 17px/1.25 var(--display);overflow-wrap:anywhere}
.card .cmp{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.age{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:5px}
.age svg{width:15px;height:15px}
.age.late{color:var(--danger);font-weight:700}
.money{font:700 18px/1.1 var(--display)}
.go{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.go svg{width:15px;height:15px}
.plate{display:inline-flex;align-items:stretch;background:var(--plate);color:var(--plate-ink);border:1.5px solid var(--plate-line);border-radius:7px;overflow:hidden;font:700 18px/1 var(--display);letter-spacing:1px;white-space:nowrap;vertical-align:middle;box-shadow:0 2px 6px rgba(10,40,55,.14)}
.plate i{font:700 9.5px/1 var(--body);font-style:normal;background:var(--plate-blue);color:#fff;display:flex;align-items:flex-end;padding:3px 3px 3px;letter-spacing:0}
.plate span{padding:5px 9px}
.plate.big{font-size:29px}.plate.big i{font-size:12px;padding:5px 5px 4px}.plate.big span{padding:7px 13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 17px;border-radius:14px;font-weight:700;background:var(--panel2);color:var(--ink);text-decoration:none;text-align:center}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:var(--wa-ink)}
.btn.dark{background:var(--head1);color:#fff}
.btn.small{padding:8px 13px;font-size:14px;border-radius:12px}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.w{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.grow{flex:1 1 140px;min-width:0}
nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--panel);border-radius:24px;box-shadow:var(--shadow2);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px}
nav button{padding:7px 2px 6px;display:grid;justify-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--mute);position:relative;border-radius:18px}
nav svg{width:23px;height:23px}
nav button[aria-current="page"]{color:var(--link);background:color-mix(in srgb,var(--link) 13%,transparent)}
nav em{position:absolute;top:2px;left:calc(50% + 7px);background:var(--danger);color:var(--panel);font:700 11px/16px var(--body);min-width:16px;height:16px;border-radius:8px;padding:0 4px}
#fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font:700 17px/1 var(--display);padding:15px 20px;border-radius:999px;display:flex;gap:7px;align-items:center;box-shadow:var(--shadow2)}
#fab svg{width:19px;height:19px}
#page{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-head{position:sticky;top:0;z-index:2;background:linear-gradient(120deg,var(--head1),var(--head2));color:var(--head-ink);display:flex;align-items:center;gap:10px;padding-block:11px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.p-head button.back{padding:7px 14px;font-weight:700;background:rgba(255,255,255,.15);border-radius:999px}
.p-head h2{font:700 20px/1.15 var(--display);flex:1;min-width:0}
.p-body{padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:13px;grid-template-columns:minmax(0,1fr);max-width:820px;margin-inline:auto}
.sec{background:var(--panel);border-radius:22px;padding:16px;display:grid;gap:13px;min-width:0;box-shadow:var(--shadow)}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.stepper button{display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--mute);position:relative;padding-block:4px}
.stepper .dot{width:22px;height:22px;border-radius:50%;background:var(--panel2);position:relative;z-index:1;box-shadow:0 0 0 3px var(--panel)}
.stepper button:not(:first-child)::before{content:"";position:absolute;top:14px;right:50%;width:100%;height:3px;background:var(--panel2)}
.stepper button.done .dot{background:var(--c-hazir)}
.stepper button.done:not(:first-child)::before,.stepper button[aria-current="step"]:not(:first-child)::before{background:var(--c-hazir)}
.stepper button[aria-current="step"]{color:var(--c)}
.stepper button[aria-current="step"] .dot{background:var(--c);box-shadow:0 0 0 3px var(--panel),0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
label.f{display:grid;gap:5px;min-width:0}
label.f.full{grid-column:1/-1}
.f input,.f select,.f textarea,textarea.ta{width:100%;padding:12px 13px;background:var(--bg);border:1.5px solid transparent;border-radius:13px;min-width:0}
.f input:focus,.f textarea:focus,textarea.ta:focus{outline:0;border-color:var(--link);background:var(--panel)}
textarea{resize:vertical}
.err{color:var(--danger);font-size:14px;font-weight:700}
.fuel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.fuel button{padding:10px 0;background:var(--panel2);font-weight:700;font-size:14px;color:var(--mute)}
.fuel button:first-child{border-radius:12px 4px 4px 12px}
.fuel button:last-child{border-radius:4px 12px 12px 4px}
.fuel button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;color:var(--mute);background:var(--panel2)}
.chip.on{background:var(--head1);color:#fff}
.car{width:100%;max-width:520px;display:block;margin-inline:auto;touch-action:manipulation;cursor:crosshair;filter:drop-shadow(0 7px 10px rgba(10,40,55,.16))}
.car .b{fill:url(#carG);stroke:var(--mute);stroke-width:1.2}
.car .g{fill:var(--glass);stroke:var(--mute);stroke-width:.9}
.car .w{fill:var(--ink)}

/* Ses ve hareket: çekmece sesi, cırcır sesi, dönen dişli */
var AC=null;
function sesAcik(){return S.set.ses===true}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function noise(c,dur){var n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;var s=c.createBufferSource();s.buffer=b;return s}
function sesCekmece(){if(!sesAcik())return;var c=ac();if(!c)return;var t=c.currentTime,s=noise(c,.2),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(1500,t);f.frequency.exponentialRampToValueAtTime(420,t+.17);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.13,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.18);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+.2);tik(c,t+.17,.14,2400)}
function tik(c,t,v,fr){var s=noise(c,.03),f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=fr||2000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.028);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+.03)}
function sesCircir(){if(!sesAcik())return;var c=ac();if(!c)return;var t=c.currentTime;for(var i=0;i<3;i++)tik(c,t+i*.055,.11,2800)}

toast=function(t){var e=$('toast');e.innerHTML=GEAR+'<span></span>';e.lastChild.textContent=t;e.hidden=false;e.classList.remove('tin');void e.offsetWidth;e.classList.add('tin');clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},2800)};

/* Lisans çekirdeği: program ve kod üretici aynı hesabı kullanır. İnternet gerektirmez. */
var LK=[32,55,42,42,28,32,22,22,9,3,24,48,15,62,51,48,106,14,104,14,98,55,9,46,28,34,40,62,9,0,111,44,119,9,49,9,60,8,2,53,60,111,49];
var LIC_AL='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
var LIC_EPOCH=Date.UTC(2026,0,1);
function sha256(str){
 var K=[],H=[],isP=function(n){for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true},fr=function(x){return (x-Math.floor(x))*4294967296|0},c=0,n=2;
 while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c]=fr(Math.pow(n,1/3));c++}n++}
 var u=unescape(encodeURIComponent(str)),b=[];for(var i=0;i<u.length;i++)b.push(u.charCodeAt(i));
 var bl=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
 for(i=7;i>=0;i--)b.push(i>=4?0:(bl>>>(i*8))&255);
 var rr=function(x,y){return (x>>>y)|(x<<(32-y))};
 for(var o=0;o<b.length;o+=64){
  var w=[];for(i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(i=16;i<64;i++){var s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  var a=H[0],bb=H[1],cc=H[2],d=H[3],e=H[4],f=H[5],g=H[6],hh=H[7];
  for(i=0;i<64;i++){var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+hh)|0;
 }
 var out=[];H.forEach(function(x){out.push((x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255)});return out;
}
function licKey(){return LK.map(function(b){return String.fromCharCode(b^90)}).join('')}
function licClean(s){return String(s||'').replace(/[iıİ]/g,'I').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function devClean(s){var c=licClean(s);if(c.indexOf('TD')===0&&c.length===10)c=c.slice(2);return c}
function devValid(c){return c.length===8&&c.split('').every(function(x){return LIC_AL.indexOf(x)>-1})}
function licSign(dev,exp){var b=sha256(licKey()+'|TD|'+dev+'|'+exp),s='';for(var i=0;i<9;i++)s+=LIC_AL[b[i]&31];return s}
function expEnc(n){return LIC_AL[(n>>10)&31]+LIC_AL[(n>>5)&31]+LIC_AL[n&31]}
function expDec(s){return (LIC_AL.indexOf(s[0])<<10)|(LIC_AL.indexOf(s[1])<<5)|LIC_AL.indexOf(s[2])}
function dayNum(ts){var d=new Date(ts);return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-LIC_EPOCH)/864e5)}
function dayTs(n){var d=new Date(LIC_EPOCH+n*864e5);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12).getTime()}
function licMake(dev,days){var e=expEnc(days),c=e+licSign(dev,e);return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8)}
function licRead(dev,code){var c=licClean(code);if(c.length!==12)return null;for(var i=0;i<12;i++)if(LIC_AL.indexOf(c[i])<0)return null;var e=c.slice(0,3);if(licSign(dev,e)!==c.slice(3))return null;return expDec(e)}

/* Deneme süresi ve lisans */
var SELLER_TEL='05533177731';
var LKEY='tamirhane_lisans_v1',TRIAL=7,licMem=null;
function licLoad(){var o=null;try{o=JSON.parse(localStorage.getItem(LKEY))}catch(e){}return o||licMem}
function licSave(){licMem=L;try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){}}
function randDev(){var b=new Uint8Array(8),s='';try{crypto.getRandomValues(b)}catch(e){for(var i=0;i<8;i++)b[i]=Math.floor(Math.random()*256)}for(var j=0;j<8;j++)s+=LIC_AL[b[j]&31];return s}
var L=licLoad();
if(!L){L={dev:randDev(),start:Date.now(),seen:Date.now(),code:''};licSave()}
function effNow(){var n=Date.now();if(n>L.seen){L.seen=n;licSave()}return Math.max(n,L.seen)}
function devShow(){return 'TD-'+L.dev.slice(0,4)+'-'+L.dev.slice(4)}
function licState(){
 var today=dayNum(effNow());
 if(L.code){var x=licRead(L.dev,L.code);if(x!==null){if(x===0)return{t:'life',lock:false};var left=x-today;return{t:'lic',until:x,left:left,lock:left<0}}}
 var used=Math.floor((sod(effNow())-sod(L.start))/DAY),rem=TRIAL-used;
 return{t:'trial',left:rem,lock:rem<=0};
}
function licText(s){if(s.t==='life')return 'Ömür boyu lisanslı';if(s.t==='lic')return s.lock?'Lisans süresi doldu':'Lisans bitişi: '+dLong(dayTs(s.until));return s.lock?'Deneme süresi bitti':'Deneme sürümü: '+s.left+' gün kaldı'}
function sellerMsg(){return 'Usta programı açma kodu istiyorum.\nCihaz kodum: '+devShow()+(S.set.name?'\nDükkan: '+S.set.name:'')}
function licForm(inputId){return '<div class="devbox"><span class="lbl">Cihaz kodunuz</span><b class="num">'+devShow()+'</b><button class="btn line small" data-a="devCopy">Kopyala</button></div><a class="btn wa w" target="_blank" rel="noopener" href="'+h(waUrl(SELLER_TEL,sellerMsg()))+'">'+ICON.wa+'Kodu Satıcıya Gönder</a><label class="f"><span class="lbl">Açma kodu</span><input id="'+inputId+'" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" style="font:700 22px/1 var(--display);letter-spacing:1px"></label><p class="err" id="'+inputId+'Err" hidden></p><button class="btn pri w" data-a="licEnter" data-in="'+inputId+'">Kodu Onayla</button>'}
function checkLock(){
 var s=licState(),el=$('lock');
 if(!s.lock){el.hidden=true;el.innerHTML='';return}
 if(!el.hidden&&el.innerHTML)return;
 el.innerHTML='<div class="stripe"></div><div class="lock-in"><h1 class="h2" style="font-size:32px">'+(s.t==='trial'?'Deneme süreniz bitti':'Lisans süreniz doldu')+'</h1><p>Kayıtlarınız silinmedi, bu cihazda duruyor. Programı açmak için cihaz kodunuzu satıcıya gönderin ve aldığınız açma kodunu girin.</p>'+licForm('licL')+'<button class="btn line w" data-a="backup">Kayıtların Yedeğini Al</button></div>';
 el.hidden=false;
}
A.devCopy=function(){var ok=function(){toast('Cihaz kodu kopyalandı')},no=function(){toast('Kopyalanamadı. Kodu elle yazın.')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(devShow()).then(ok,no);else no()};
A.licEnter=function(d){
 var v=$(d.in).value,e=$(d.in+'Err'),x=licRead(L.dev,v);
 var fail=function(t){e.textContent=t;e.hidden=false};
 if(!licClean(v))return fail('Açma kodunu yazın.');
 if(x===null)return fail('Bu kod bu cihaza ait değil. Kodu kontrol edin veya satıcıya yazın.');
 if(x!==0&&x<dayNum(effNow()))return fail('Bu kodun süresi geçmiş. Satıcıdan yeni kod isteyin.');
 L.code=licClean(v);licSave();$('lock').hidden=true;$('lock').innerHTML='';render();toast('Programınız açıldı');
};
var _vA=vAtolye;vAtolye=function(){var s=licState(),b='';if(s.t==='trial'&&s.left<=3&&!s.lock)b='<div class="notice"><p>Deneme sürenizin bitmesine '+s.left+' gün kaldı.</p><button data-a="tab" data-t="dukkan">Lisans Al</button></div>';else if(s.t==='lic'&&s.left<=7&&!s.lock)b='<div class="notice"><p>Lisansınızın bitmesine '+s.left+' gün kaldı.</p><button data-a="tab" data-t="dukkan">Lisansı Yenile</button></div>';return b+_vA()};
var _vD=vDukkan;vDukkan=function(){var s=licState();return _vD()+'<section class="sec"><div class="row sb"><h2 class="h2"><span class="ic">'+ICON.key+'</span>Lisans</h2><span class="pill" style="--c:var(--c-'+(s.t==='trial'?'parca':'hazir')+')">'+licText(s)+'</span></div>'+licForm('licD')+'</section>'};
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='jobMore')moreOpen=e.target.open},true);
